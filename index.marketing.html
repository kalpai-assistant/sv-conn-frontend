<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!--
      Theme bootstrap (SVC-378 Phase 1.5). Runs synchronously BEFORE any
      stylesheet parses or body paints, so the correct .dark / .light
      class is on <html> for the very first frame — no flash of wrong
      theme.

      Three states:
        "dark"   — user explicitly picked dark (ignores OS)
        "light"  — user explicitly picked light (ignores OS)
        "system" — follow prefers-color-scheme (default)

      The stored key is `sc_theme` so SVC-350's logout sweep leaves it
      alone (not a logged-in user signal — a browser-level preference).

      Wrapped in try/catch because localStorage throws in Safari private
      mode and when a browser blocks storage; a thrown error here would
      abort head parsing and blank the page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sc_theme");
          var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective =
            stored === "dark" || (stored !== "light" && systemDark)
              ? "dark"
              : "light";
          var html = document.documentElement;
          html.classList.remove("dark", "light");
          html.classList.add(effective);
        } catch (_e) {
          // storage blocked — fall through, @media + CSS defaults handle it
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EazyServ — Home Services at Your Doorstep in Pune</title>
    <meta
      name="description"
      content="Book verified professionals for cleaning, plumbing, electrical, and salon services in Pune. Transparent pricing, doorstep OTP verification."
    />
    <meta property="og:title" content="EazyServ — Home Services in Pune" />
    <meta
      property="og:description"
      content="Book trusted home services in Pune — cleaning, plumbing, electrical, salon & more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eazyserv.com/" />
    <meta property="og:site_name" content="EazyServ" />
    <!--
      og:image is what WhatsApp / Facebook / LinkedIn render when someone
      shares the link — the main sharing channel for this audience.

      public/og-banner.jpg is cropped from the brand banner kept at
      brand/og-source.jpeg (see brand/README.md for the exact command). A
      full-height crop of that source is
      always 1269px wide and runs into the photographed technician, so the
      crop trims 47px of height (mostly empty navy at the top) to stop at
      1180px, ending cleanly on the photo panels. Regenerate with sharp if
      the source is ever replaced; keep it 1200x630 and under ~200 KB,
      since every preview fetch pays for it.

      The URL must stay absolute. Scrapers do not resolve relative paths.
    -->
    <meta property="og:image" content="https://eazyserv.com/og-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="EazyServ — quick, reliable, hassle-free home services in Pune"
    />
    <!-- Wide card now that the image is 1.91:1. This was "summary" while the
         image was a square icon, which was the correct pairing then. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://eazyserv.com/og-banner.jpg" />
    <!-- Tints the browser chrome on mobile. Kept in step with `--primary`
         in src/marketing/marketing-theme.css: oklch(0.5 0.2 262) = #1957D2.
         This is the marketing build's own head, so changing it here does
         not affect the app, which still ships #7C3AED. -->
    <meta name="theme-color" content="#1957D2" />

    <!--
      Canonical tells Google which URL is the real one when several could
      serve the same content (www vs apex, trailing slash, tracking params
      like the ?igsh= that Instagram appends). Without it those can be
      indexed as separate duplicate pages.

      This is the homepage value. src/marketing/main.tsx rewrites it on
      /download, because this file is the single entry for every route.
    -->
    <link rel="canonical" href="https://eazyserv.com/" />

    <!--
      Structured data. This is the highest-value SEO item for a
      city-specific service business: it tells Google what the entity IS —
      name, city, services, socials — rather than leaving it to infer from
      prose.

      Everything below is verifiable. Nothing is invented:
        - legalName + foundingDate come from the company profile
          (incorporated 9 July 2026)
        - sameAs are the live social profiles
        - areaServed is Pune, matching the page copy

      Deliberately ABSENT, and each for a reason:
        - streetAddress / telephone — the registered address is still
          unknown and refund.md carries a placeholder number (9876543210).
          Publishing a placeholder phone in structured data is worse than
          omitting it. Google will flag both as "missing recommended
          field"; that warning is correct and should stay until someone
          supplies the real values.
        - aggregateRating / review — there are no real reviews yet, and
          marking up ratings you cannot evidence is a manual-action risk,
          not just bad practice.
        - priceRange — no confirmed pricing.

      Test changes with the Rich Results Test before merging.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "@id": "https://eazyserv.com/#business",
        "name": "EazyServ",
        "legalName": "EazyServ Technologies India Private Limited",
        "url": "https://eazyserv.com/",
        "logo": "https://eazyserv.com/favicon-eazyserv.png",
        "image": "https://eazyserv.com/og-banner.jpg",
        "description": "Home services marketplace in Pune. Book verified professionals for cleaning, plumbing, electrical, appliance repair, salon and more.",
        "email": "support@eazyserv.com",
        "foundingDate": "2026-07-09",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": {
          "@type": "City",
          "name": "Pune"
        },
        "sameAs": [
          "https://www.instagram.com/eazyserv",
          "https://www.facebook.com/profile.php?id=61593274072168",
          "https://x.com/EazyServ",
          "https://www.youtube.com/@EazyServ"
        ]
      }
    </script>

    <!--
      favicon-eazyserv.png is the brand mark cropped from
      brand/eazyserv-logo-source.svg (see brand/README.md).

      It deliberately does NOT use /icons/icon-192.png or
      /apple-touch-icon.png: those are still the pre-rebrand purple "SC"
      ServiceConnect artwork from before this was EazyServ. They are shared
      with the app build and referenced by the PWA manifest, so replacing
      them is an app-side change and needs its own ticket — but the
      marketing site should not keep shipping the old logo in the meantime.

      Note public/eazyserv-mark.svg is not used either: it renders as a
      solid blue rosette with the navy star cutout missing, so it is not
      the real mark.
    -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-eazyserv.png" />
    <link rel="apple-touch-icon" href="/favicon-eazyserv.png" />

    <!--
      Both preconnects are needed: the CSS comes from fonts.googleapis.com
      but the font files themselves come from fonts.gstatic.com, which is a
      separate origin. Without the second hint the browser only starts that
      connection after parsing the CSS. gstatic requires crossorigin
      because fonts are fetched in CORS mode.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking Inter stylesheet (SVC-378 Phase 1). Previously this was a
      plain `<link rel="stylesheet">`, which Lighthouse flagged as
      render-blocking for ~400ms on the baseline. The preload + onload swap
      pattern is a well-supported idiom: browsers that honour it defer the
      network cost off the critical path; browsers that ignore `preload`
      still get the font via the `<noscript>` fallback, and browsers without
      JS still render in Inter.

      The onload handler nulls itself to stop a (very rare) double-fire if
      the preload is applied before DOM-parse completes. Setting
      this.rel='stylesheet' is what actually starts the parse — `preload`
      alone fetches but doesn't apply.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!--
      FOUC-prevention shell (SVC-378 Phase 1). Inline so it applies
      before any CSS fetch resolves. React swaps #root on mount — this is
      what the visitor sees for the fraction of a second between HTML
      parse and React boot. Branded, not a white flash.

      "Loading…" text is intentional. On a stuck JS chunk (the 2026-08-17
      incident) this at least reads as "something is happening" rather
      than a blank page. Readable in the fallback font stack so it
      renders even with Inter unloaded.

      ⚠️ TOKEN PARITY — THESE VALUES MUST MATCH src/styles.css + marketing-theme.css.
      Any drift means the pre-mount shell flashes a different colour than the
      React-mounted page. Current mapping:
        --background         → src/styles.css :root           oklch(0.975 0.002 250)
        --foreground         → marketing-theme.css override   oklch(0.2 0.05 262.7)
        --muted-foreground   → marketing-theme.css override   oklch(0.5 0.03 262.7)
        dark --background    → src/styles.css @media dark     oklch(0.18 0.015 260)
        dark --foreground    → src/styles.css @media dark     oklch(0.95 0.005 260)
        dark --muted-fg      → src/styles.css @media dark     oklch(0.7 0.02 260)
      If either stylesheet changes, mirror the edit here.
    -->
    <style>
      /*
        Light defaults — always apply, overridden by .dark selectors below
        OR by the @media rule when the user hasn't explicitly picked light.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        background: oklch(0.975 0.002 250);
        color: oklch(0.2 0.05 262.7);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #root:empty::before {
        content: "Loading EazyServ…";
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        color: oklch(0.5 0.03 262.7);
        font-size: 14px;
      }

      /* Explicit toggle dark — set by the bootstrap script above. */
      html.dark,
      html.dark body {
        background: oklch(0.18 0.015 260);
        color: oklch(0.95 0.015 262.7);
      }
      html.dark #root:empty::before {
        color: oklch(0.7 0.025 262.7);
      }

      /* OS-auto dark (also no-JS fallback). :not(.light) lets an
         explicit-light pick override even on OS-dark machines. */
      @media (prefers-color-scheme: dark) {
        html:not(.light),
        html:not(.light) body {
          background: oklch(0.18 0.015 260);
          color: oklch(0.95 0.015 262.7);
        }
        html:not(.light) #root:empty::before {
          color: oklch(0.7 0.025 262.7);
        }
      }
    </style>

    <!--
      Cloudflare Web Analytics (SVC-378 Phase 1). Free, cookieless, no
      cookie-banner needed; async + `defer` means zero perf impact.

      The token is injected at build time via VITE_CF_ANALYTICS_TOKEN. If
      unset (local dev, unbootstrapped CF account), vite leaves the placeholder
      string and the beacon POST returns 404 — benign, no user-visible effect.
      Set the real UUID in Cloudflare Pages env or in a GitHub Actions secret
      consumed by .github/workflows/deploy-marketing.yml.
    -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "%VITE_CF_ANALYTICS_TOKEN%"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/marketing/main.tsx"></script>
  </body>
</html>
