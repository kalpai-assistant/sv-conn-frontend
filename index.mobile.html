    <!--
      SVC-383: First-paint skeleton.

      Fills the window between the native Capacitor splash fading out and
      React committing its first render. Without this the user sees a flash
      of white (the WebView's default) or whatever the <body> paints under
      ``bg-background``, which reads as an unbranded flicker on cold start.

      Lives inline on purpose — the stylesheet and the chunk JS haven't
      loaded yet in the window this covers. Inline SVG + inline <style>
      means it renders from the HTML parser without any network wait.

      Hides itself the moment React mounts: ``createRoot(root).render(...)``
      replaces the children of #root, so the splash div is wiped at commit.
      The brand gradient here matches the native splash background in
      capacitor.config.ts and the status bar colour set by StatusBar on
      launch (src/main.mobile.tsx), so the three layers hand off cleanly.
    -->
    <style>
      #splash-first-paint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Brand blue → darker variant. --primary (OKLCH 0.5 0.2 262) is
           #1957D2 in sRGB; the darker stop (#0F3C94) is the same hue,
           chroma held, lightness pulled from 0.5 → 0.37. The gradient is
           subtle on purpose — it reads as depth, not a theme shift. */
        background: linear-gradient(180deg, #1957D2 0%, #0F3C94 100%);
      }
      #splash-first-paint svg {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
