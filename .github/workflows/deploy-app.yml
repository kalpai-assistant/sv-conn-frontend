# Deploy app.eazyserv.com → Cloudflare Pages project `sv-conn-frontend`.
#
# Historically deployed via the Cloudflare Pages Git integration (CF watches
# main and rebuilds). This workflow replaces that so we can:
#   - Gate the deploy on CI success (Git integration deploys even on failing
#     builds — it has its own build pipeline that doesn't know about CI).
#   - Trigger a deploy on demand (workflow_dispatch) for hotfixes / rollbacks
#     without pushing a commit.
#   - Keep parity with the backend's deploy-beta.yml pattern.
#
# Runtime env vars (VITE_*) come from two places, and the split is deliberate:
#
#   - Most are read from the Cloudflare Pages project's production config, so
#     rotating one needs no code change.
#   - The Google Maps browser key is read from SSM instead (SVC-309). It is
#     shared with the APK build, and a secret living in two stores drifts the
#     moment someone rotates one of them — which surfaces as a silently broken
#     location screen rather than an error.
#
# The CF Pages Git integration has been disabled (2026-08-20). This
# workflow is now the sole path that ships main to app.eazyserv.com.

name: Deploy app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Marketing has its own bundle + workflow (deploy-marketing.yml); a
    # marketing-only change should not rebuild + reship the app.
    paths-ignore:
      - "src/marketing/**"
      - "index.marketing.html"
      - "vite.marketing.config.ts"
      - "**.md"
      - ".gitignore"

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `id-token: write` is what lets configure-aws-credentials assume the
    # deploy role via OIDC; without it the SSM read below cannot authenticate.
    # `contents: read` is the default that declaring any permission replaces,
    # restated so the checkout keeps working.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pull the VITE_* env vars from the CF Pages project's production
      # config. Keeps CF as the source of truth for build-time inlined
      # values (API URL, Razorpay/Firebase public keys, Sentry DSN, etc.)
      # so a key rotation only needs an edit in one place.
      #
      # API: https://developers.cloudflare.com/api/operations/pages-project-get-project
      # The API returns each env var as {"type":"plain_text","value":"..."}
      # or {"type":"secret_text","value":"..."} — both flavours have `.value`
      # readable via the API token (needs Pages:Read scope).
      - name: Fetch VITE_* build env from CF Pages project
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: sv-conn-frontend
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT")
          SUCCESS=$(echo "$RESP" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::CF Pages API returned failure:"
            echo "$RESP" | jq '.errors // .'
            exit 1
          fi
          # Extract every VITE_* key from the production env_vars block.
          # Mask each value before exporting so it never appears in logs.
          echo "$RESP" | jq -r '.result.deployment_configs.production.env_vars // {} | to_entries[] | select(.key | startswith("VITE_")) | "\(.key)\t\(.value.value)"' \
          | while IFS=$'\t' read -r key val; do
              echo "::add-mask::$val"
              echo "$key=$val" >> "$GITHUB_ENV"
              echo "  loaded $key (len=${#val})"
            done

      # Build the mobile SPA bundle. Note: the live app.eazyserv.com currently
      # serves index.mobile-*.js (verified via `curl https://app.eazyserv.com/`),
      # so this matches production behaviour. If the SSR/PWA `npm run build`
      # variant is the intended target, swap the two lines below AND update
      # the wrangler deploy dir to `dist`.
      # Same role and region the release-apk workflow uses; that workflow is the
      # proof this repo's OIDC trust works against this account.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ap-south-1

      # Note the name change across the boundary: SSM stores this as
      # GOOGLE_MAPS_API_KEY, the frontend reads VITE_GOOGLE_MAPS_BROWSER_API_KEY
      # (`src/lib/google-maps.ts`). The names do not match by accident — the SSM
      # entry predates the frontend variable — so the mapping is explicit.
      #
      # Written to $GITHUB_ENV rather than a step-level `env:` so it reaches the
      # build the same way the CF-sourced values above do.
      - name: Fetch Maps browser key from SSM
        run: |
          set -euo pipefail
          MAPS_KEY=$(aws ssm get-parameter             --name /eazyserv/beta/GOOGLE_MAPS_API_KEY             --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$MAPS_KEY"
          echo "VITE_GOOGLE_MAPS_BROWSER_API_KEY=$MAPS_KEY" >> "$GITHUB_ENV"
          echo "  loaded VITE_GOOGLE_MAPS_BROWSER_API_KEY (len=${#MAPS_KEY})"

      - name: Build app bundle
        run: |
          set -euo pipefail
          npm run build:mobile

          # Fail loudly rather than shipping a PWA whose location screens are
          # broken. The bundle carries the throw path from `google-maps.ts` when
          # the key is absent, so this checks the value was actually inlined —
          # not merely that the variable was set.
          # --include='*.js' matters: the same string survives in the
          # accompanying .js.map whatever was inlined, because a source map
          # carries the original source text. Grepping the whole directory
          # makes this fire on every build, good or bad.
          if grep -rq --include='*.js' "GOOGLE_MAPS_BROWSER_API_KEY is not set" dist-mobile/assets/; then
            echo "::error::Maps key was not inlined — location screens would ship broken"
            exit 1
          fi

      # Wrangler action handles auth + `wrangler pages deploy`. `--branch=main`
      # promotes the deploy to production on the Pages project; any other
      # branch value produces a preview deploy on a *.pages.dev URL.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-mobile --project-name=sv-conn-frontend --branch=main
