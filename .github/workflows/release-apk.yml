# Signed Android release APK → S3 (SVC-160 back half).
#
# Manual trigger only (no auto on push): each release is deliberate and
# should be paired with a versionCode/versionName bump. Follow-up work
# to enforce the version bump inside the workflow is TBD.
#
# Auth to AWS is via GitHub OIDC → the shared `eazyserv-github-deploy`
# role (trust-policy allows both sv-conn-backend + sv-conn-frontend
# after the SVC-160 IAM update). The role has a scoped inline policy
# that only permits writes to `s3://eazyserv-downloads/apk/*` and
# `latest.json` — nothing else. No long-lived AWS keys as GH secrets.
#
# Keystore is base64-decoded from a secret into the exact path
# `keystore.properties` expects, then the two password env vars go into
# the gradle step. `RELEASE.md` documents the full local flow this
# mirrors.

name: Release APK to S3

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Uploaded as eazyserv-<version>.apk + latest.apk"
        required: true
        type: string
      release_notes:
        description: "Short plain-text release notes (shown in the in-app nudge)"
        required: false
        type: string
        default: ""
      notify:
        description: "After APK upload, tell the backend to bump app_versions AND push an FCM broadcast. Turn off for validation-only runs."
        required: false
        type: boolean
        default: true
      min_supported_version:
        description: "Emergency: hard-block anyone below this version. Leave empty to keep the current threshold."
        required: false
        type: string
        default: ""

concurrency:
  group: release-apk
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: eazyserv-downloads

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # AGP is currently pinned to JDK 21 — see RELEASE.md for the "why 21,
      # not the newest LTS" note. Bumping this must be coordinated with
      # Gradle / AGP versions in android/.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No setup-android action here, deliberately.
      #
      # It asked sdkmanager for the `tools` package on every run, and Google has
      # since removed that package from the SDK repository, so sdkmanager exits
      # 1 with "Failed to find package 'tools'" and the release dies before npm
      # install. Nothing in this repo changed — the same workflow succeeded a
      # day earlier — and pinning the action to v4 did not help: v4 ran with
      # cmdline-tools 20.0 and made the same obsolete request.
      #
      # The action was never doing much for us. The ubuntu-latest image already
      # ships a licensed Android SDK at /usr/local/lib/android/sdk with
      # ANDROID_HOME and ANDROID_SDK_ROOT set, which is what Gradle resolves
      # against; the failing step was itself using that preinstalled copy.
      # Asserting the SDK is present is cheaper than an action that installs
      # nothing we need and can break on Google's release schedule.
      - name: Verify Android SDK is present
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/platforms" ]; then
            echo "::error::No Android SDK on the runner image; restore an SDK setup step."
            exit 1
          fi
          ls "$SDK/platforms"

      - name: Install npm dependencies
        run: npm ci

      # `build:mobile` produces dist-mobile/ ; cap sync copies it into
      # android/app/src/main/assets/public where Capacitor picks it up.
      #
      # Vite inlines `import.meta.env.VITE_*` at build time. Without
      # VITE_API_BASE_URL the bundled app defaults to `/api/v1` which on
      # a Capacitor device resolves to `capacitor://localhost/api/v1` —
      # no server → apiFetch rejects on boot → AppVersionGate crashes →
      # user sees a white screen on the phone. Hardcoded to the beta
      # backend URL for now; move to a repo variable once we run a
      # separate staging backend.
      # Hoisted above the build, deliberately. Vite inlines `import.meta.env.VITE_*`
      # at build time, so any secret the bundle needs has to be in the environment
      # *before* `npm run build:mobile` runs. This step used to sit ~100 lines
      # lower, just before the S3 upload — which is why the Maps key could not be
      # read into the bundle however it was configured (SVC-309).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # `build:mobile` produces dist-mobile/ ; cap sync copies it into
      # android/app/src/main/assets/public where Capacitor picks it up.
      #
      # The Maps key comes from SSM rather than a repo secret so there is ONE
      # source of truth shared with the PWA deploy. Note the name change across
      # the boundary: SSM stores it as GOOGLE_MAPS_API_KEY, the frontend reads
      # VITE_GOOGLE_MAPS_BROWSER_API_KEY (`src/lib/google-maps.ts`). The mapping
      # is explicit here because the names do not match by accident — the SSM
      # entry predates the frontend variable.
      #
      # Without it `reverseGeocode` throws on every call, and the failures are
      # quiet: the provider location gate silently drops its saved-location row,
      # and iOS shows "Couldn't get your location" after a successful GPS fix.
      #
      # Written to $GITHUB_ENV (matching deploy-app.yml) so the SVC-317 probe
      # step below can see it — an in-step `export` would not reach a
      # subsequent step.
      - name: Fetch Maps browser key from SSM
        run: |
          set -euo pipefail
          MAPS_KEY=$(aws ssm get-parameter             --name /eazyserv/beta/GOOGLE_MAPS_API_KEY             --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$MAPS_KEY"
          echo "VITE_GOOGLE_MAPS_BROWSER_API_KEY=$MAPS_KEY" >> "$GITHUB_ENV"
          echo "  loaded VITE_GOOGLE_MAPS_BROWSER_API_KEY (len=${#MAPS_KEY})"

      # SVC-317: a non-empty key can still ship a dead APK if either API is
      # disabled on the GCP project (as happened on 2026-09-24) or if
      # billing/restrictions drift. Hit both endpoints the app actually
      # uses; fail-fast if either is not OK so the fix is `gcloud services
      # enable`, not a workflow rerun.
      - name: Verify Google Maps APIs are live
        shell: bash
        run: |
          set -euo pipefail
          key="$VITE_GOOGLE_MAPS_BROWSER_API_KEY"
          [ -z "$key" ] && { echo "::error::VITE_GOOGLE_MAPS_BROWSER_API_KEY empty"; exit 1; }
          gc=$(curl -sf "https://maps.googleapis.com/maps/api/geocode/json?latlng=18.5204,73.8567&key=$key" | jq -r .status)
          [ "$gc" = "OK" ] || { echo "::error::Geocoding API not OK (got $gc)"; exit 1; }
          pl=$(curl -sf -X POST "https://places.googleapis.com/v1/places:autocomplete" \
                 -H "Content-Type: application/json" -H "X-Goog-Api-Key: $key" \
                 -d '{"input":"pune"}' | jq -r 'has("suggestions")')
          [ "$pl" = "true" ] || { echo "::error::Places API (New) autocomplete failed"; exit 1; }

      - name: Build mobile web bundle + sync to Android
        env:
          VITE_API_BASE_URL: https://api.eazyserv.com/api/v1
        run: |
          set -euo pipefail
          npm run build:mobile
          npx cap sync android

          # Fail loudly rather than shipping an APK whose location screens are
          # broken. The bundle carries the throw path from `google-maps.ts` when
          # the key is absent, so grepping for it is a direct check that the
          # value was actually inlined — not merely that the variable was set.
          # --include='*.js' matters: the same string survives in the
          # accompanying .js.map whatever was inlined, because a source map
          # carries the original source text. Grepping the whole directory
          # makes this fire on every build, good or bad.
          if grep -rq --include='*.js' "GOOGLE_MAPS_BROWSER_API_KEY is not set" dist-mobile/assets/; then
            echo "::error::Maps key was not inlined — location screens would ship broken"
            exit 1
          fi

      # Materialise the release keystore from the base64 secret. The path
      # must match what `keystore.properties.example` declares:
      # storeFile=../keystore/eazyserv-release.jks (relative to android/app/)
      - name: Materialise release keystore + properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/eazyserv-release.jks
          cp android/keystore.properties.example android/keystore.properties

      # google-services.json is gitignored (it carries the Firebase API key),
      # so the runner has no copy and Gradle's google-services plugin is
      # skipped — see the try/catch in android/app/build.gradle. That produced
      # an APK with no google_app_id, and the app died on launch with
      # "Default FirebaseApp is not initialized" the moment #103 made
      # PushNotifications.register() actually reach native code.
      #
      # Failing hard here rather than warning: a release APK without Firebase
      # config crashes on every device, so shipping one is never the outcome
      # we want. The Gradle-side catch stays lenient for local dev builds.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 is not set. A release APK built"                  "without it crashes on launch (Default FirebaseApp is not initialized)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          # Validate rather than trust: a truncated or mis-pasted secret decodes
          # to garbage that Gradle would happily skip over, putting us straight
          # back to a crashing APK with a green build.
          python3 -c "import json,sys; d=json.load(open('android/app/google-services.json'));             pkgs=[c['client_info']['android_client_info']['package_name'] for c in d['client']];             sys.exit(0 if 'com.eazyserv.app' in pkgs else 'com.eazyserv.app missing from google-services.json: %s' % pkgs)"
          echo "google-services.json OK (project: $(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['project_info']['project_id'])"))"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease

      # The step above cannot fail for a missing google_app_id — Gradle skips
      # the plugin silently and logs it at info level. This is what turns that
      # silence into a red build: the resource only exists if the plugin ran.
      - name: Verify Firebase config landed in the APK
        run: |
          RES=android/app/build/generated/res/processReleaseGoogleServices/values/values.xml
          test -f "$RES" || {
            echo "::error::google-services plugin did not run — the APK has no Firebase"                  "config and will crash on launch."
            exit 1
          }
          grep -q "google_app_id" "$RES" || {
            echo "::error::google_app_id missing from generated resources."
            exit 1
          }
          echo "Firebase config present in the release build."

      # Belt-and-braces verify: gradle's `validateSigningRelease` already
      # refuses to build a release APK without a signing config, so this
      # step is mostly for surfacing the cert DN in the build log (nice
      # for provenance) and catching the corner case where a debug key
      # sneaks in. `apksigner verify`'s exit code is the source of truth
      # — grepping the human-readable output is fragile across SDK
      # versions.
      - name: Verify APK signing
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK missing: $APK"; exit 1; }
          echo "APK size: $(stat -c%s "$APK") bytes"

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          echo "Using apksigner: $APKSIGNER"

          # Print for the log — reviewers want to see the DN. Wrapped in
          # `set +e` so the print itself never gates the step.
          set +e
          "$APKSIGNER" verify --print-certs --verbose "$APK"
          set -e

          # Exit code is authoritative: 0 = signed, non-zero = not.
          "$APKSIGNER" verify "$APK" \
            || { echo "APK is not signed"; ls -la android/keystore/ android/keystore.properties 2>&1 || true; exit 1; }

          # Guard against debug signing sneaking through (shouldn't with
          # the hasKeystore gate in build.gradle, but defense in depth).
          if "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -qE "Android Debug|CN=Android"; then
            echo "APK is DEBUG-signed — release signing config didn't fire"
            exit 1
          fi

      # Two uploads:
      # - Versioned key preserves history (users can grab a specific build).
      # - `latest.apk` is what the /download page links to via
      #   `VITE_APK_URL` — updates every release with no client-side change.
      # Long cache-control on the versioned key (immutable content), short
      # on latest.apk so a new release is picked up within 5 min at edge.
      - name: Upload APK to S3
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          aws s3 cp "$APK" "s3://${S3_BUCKET}/apk/eazyserv-${VERSION}.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$APK" "s3://${S3_BUCKET}/apk/latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=300"

      - name: Print URLs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Versioned: https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/apk/eazyserv-${VERSION}.apk"
          echo "Latest:    https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/apk/latest.apk"

      # SVC-227.2: notify the backend that a new APK is live. The endpoint
      # bumps app_versions.android atomically and (unless notify=false)
      # enqueues an FCM broadcast so users learn about the update without
      # opening the app.
      #
      # Auth uses X-Internal-Release-Token (SVC-227.2) — the token is a
      # SecureString SSM param scoped to this endpoint. No admin JWT needed
      # here (CI has no user).
      #
      # `notify=false` runs OFF this step entirely — validation-only
      # workflow_dispatches from a feature branch shouldn't touch the
      # live app_versions row. Set the input to false for those runs.
      - name: Publish release to backend
        if: ${{ inputs.notify }}
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          MIN_SUPPORTED: ${{ inputs.min_supported_version }}
          API_URL: https://api.eazyserv.com/api/v1
        run: |
          set -euo pipefail
          TOKEN=$(aws ssm get-parameter \
            --name /eazyserv/beta/INTERNAL_RELEASE_TOKEN \
            --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$TOKEN"

          # Build the JSON body. jq guarantees safe escaping — Bash string
          # interpolation of arbitrary release-notes into JSON is a
          # quoting nightmare (backticks, backslashes, curly braces).
          BODY=$(jq -n \
            --arg version "$VERSION" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg min_supported "$MIN_SUPPORTED" \
            '{version: $version}
             + (if $release_notes == "" then {} else {release_notes: $release_notes} end)
             + (if $min_supported == "" then {} else {min_supported_version: $min_supported} end)')
          echo "Publishing to $API_URL/admin/app-versions/android/release"
          echo "Body: $BODY"

          HTTP_CODE=$(curl -sS -o /tmp/release_response.json -w "%{http_code}" \
            -X POST "$API_URL/admin/app-versions/android/release" \
            -H "X-Internal-Release-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "HTTP $HTTP_CODE"
          cat /tmp/release_response.json | jq . || cat /tmp/release_response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Release endpoint returned HTTP $HTTP_CODE — APK is uploaded but the version row was NOT bumped. Fix + re-run this step (or bump the row by hand)."
            exit 1
          fi
          echo "✓ app_versions.android bumped to $VERSION; FCM broadcast enqueued."
