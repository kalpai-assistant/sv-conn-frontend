# Deploy eazyserv.com marketing site → Cloudflare Pages.
#
# Separate from the app deploy: the app (app.eazyserv.com) uses the
# default Cloudflare Pages Git integration on the main branch, which
# picks up `dist/` from `npm run build`. This workflow drives a second
# Pages project (`eazyserv-marketing`) via wrangler so we can build a
# different Vite config (`vite.marketing.config.ts` → `dist-marketing/`)
# without fighting the Pages Git integration, which only supports one
# build per project.
#
# Runs on push to main whenever files that affect the marketing bundle
# change — no point deploying when only app-only code moved. Manual
# workflow_dispatch is also wired so you can force a redeploy.

name: Deploy marketing site

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Prefer over-triggering to under-triggering. A missed deploy is silent:
    # the merge goes green, nothing ships, and you only notice when a URL
    # you expected is still 404ing. A redundant deploy of a static bundle
    # costs a couple of CI minutes.
    #
    # This list previously missed `public/**` and `index.marketing.html`,
    # so the Search Console verification file merged in #63 never shipped
    # and had to be deployed by hand. It also watched
    # `src/lib/build-target.ts`, which does not exist, and four
    # `src/routes/*` files that the marketing SPA does not import at all —
    # the marketing build is a separate entry (index.marketing.html ->
    # src/marketing/main.tsx) and never touches the app's router.
    paths:
      - "src/marketing/**"
      # Shared theme — marketing imports it, then overrides the brand
      # tokens in src/marketing/marketing-theme.css.
      - "src/styles.css"
      # DownloadPage imports detectPlatform from here.
      - "src/lib/platform.ts"
      # Favicon, OG banner, brand imagery, verification files.
      - "public/**"
      - "index.marketing.html"
      - "vite.marketing.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-marketing.yml"

concurrency:
  group: deploy-marketing
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite inlines `import.meta.env.VITE_*` at build time — setting these
      # in the Cloudflare Pages dashboard would be a no-op because the build
      # runs here, not on Cloudflare. Any VITE_* that DownloadPage/etc. need
      # has to be present in this step's env.
      #
      # VITE_APK_URL is the S3 object URL for the latest signed APK. Bucket
      # policy is public-read, so hardcoding it here is safe (no secret).
      # When a real CDN sits in front of this we move it to a repo variable.
      - name: Build marketing bundle
        env:
          VITE_APK_URL: https://eazyserv-downloads.s3.ap-south-1.amazonaws.com/apk/latest.apk
        run: npm run build:marketing

      # Wrangler action handles auth + `wrangler pages deploy`. The Pages
      # project `eazyserv-marketing` must exist beforehand (created via
      # dashboard once; see the beta setup runbook).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-marketing --project-name=eazyserv-marketing --branch=main
