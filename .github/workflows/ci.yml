name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci enforces lock consistency (fails on drift) — desirable in CI.
      - name: Install dependencies
        run: npm ci

      # Workaround for npm bug #4828: when package-lock.json is generated on
      # macOS, `npm ci` on Linux skips native-binary optional deps
      # (@rollup/rollup-linux-x64-gnu, lightningcss.linux-x64-gnu, and any
      # future native package). `npm rebuild` with no arg re-runs every
      # package's postinstall so each one correctly detects the current
      # platform. Slower than targeted rebuilds but survives new native
      # deps without further edits.
      - name: Rebuild native binaries
        run: npm rebuild

      - name: Lint
        run: npm run lint

      # tsc with --noEmit is our typecheck — package.json has no dedicated
      # script, so call it directly. tsconfig already sets noEmit but the
      # explicit flag protects against a future config change.
      - name: Typecheck
        run: npx tsc --noEmit

      # Web build. Mobile build (build:mobile) is Capacitor-specific and
      # only meaningful during a native release — skipped in CI.
      - name: Build (web)
        run: npm run build
