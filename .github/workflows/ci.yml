name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci enforces lock consistency (fails on drift) — desirable in CI.
      # Cross-platform native binaries (rollup, lightningcss) are handled by
      # declaring both mac + linux packages as top-level optionalDependencies
      # in package.json — each package's own os/cpu filter ensures only the
      # matching platform's binary installs. See package.json for the list.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc with --noEmit is our typecheck — package.json has no dedicated
      # script, so call it directly. tsconfig already sets noEmit but the
      # explicit flag protects against a future config change.
      - name: Typecheck
        run: npx tsc --noEmit

      # Web build. Mobile build (build:mobile) is Capacitor-specific and
      # only meaningful during a native release — skipped in CI.
      - name: Build (web)
        run: npm run build

      # Marketing is a SEPARATE build target with its own entry, config and
      # deploy workflow, so `npm run build` above does not cover it. Without
      # this step a change that breaks eazyserv.com passes CI green and only
      # fails later in deploy-marketing.yml — after merge, with the site
      # silently still serving the previous version.
      #
      # This would have caught the qrcode.react failure, where the package
      # was in package.json and the lockfile but absent from the working
      # node_modules: the app build never imports it, only DownloadPage does.
      #
      # Note the npm script ends in `&& mv`, which is fine on this ubuntu
      # runner but fails locally on Windows, where npm runs scripts through
      # cmd.exe. Devs there run the two steps by hand — see
      # MARKETING_LANDING_WIP.md.
      - name: Build (marketing)
        run: npm run build:marketing
