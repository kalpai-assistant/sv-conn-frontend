# Deploy admin.eazyserv.com → Cloudflare Pages project `eazyserv-admin`.
#
# ⚠️ NOT YET LIVE (SVC-421). This is deploy plumbing only: the Pages project,
# the admin.eazyserv.com DNS record and any access policy in front of it do not
# exist yet, and are a follow-up ticket. The first step fails the run on
# purpose, so a manual dispatch cannot push the admin app anywhere before
# that work is done. To go live: create the Pages project, confirm the API
# token can deploy to it, then delete the "Not yet live" step.
#
# Modelled on deploy-app.yml, minus everything consumer-specific (SSM Maps
# key, push service worker, mobile bundle). Manual dispatch only — no push
# trigger until the target exists.

name: Deploy admin

on:
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Not yet live
        run: |
          echo "::error::deploy-admin is a stub (SVC-421): the eazyserv-admin Pages project and admin.eazyserv.com do not exist yet."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL must be absolute here: the admin app is served from
      # its own origin, so the /api/v1 default would hit Pages, not the backend.
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.eazyserv.com/api/v1
        run: npm run build

      # Same secrets deploy-app.yml already uses; no new ones to create.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: pages deploy dist --project-name=eazyserv-admin --branch=main
