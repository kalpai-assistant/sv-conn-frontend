server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: client-side router owns every non-asset path.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset files — long-lived cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html — never cache so a new deploy ships instantly.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
