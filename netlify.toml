# Netlify config — serves the Capacitor SPA build as the beta web/PWA.
#
# Why the mobile build and not `npm run build`? The default build uses
# TanStack Start SSR (see vite.config.ts) which needs a Node runtime.
# Netlify supports it via an adapter, but the SPA path is:
#   - simpler (static files, no server)
#   - identical UX for our beta (no SEO / no server-only routes)
#   - the same output we ship inside the Android APK, so any bug shows
#     up in both places at once — easier to debug than "PWA works but
#     Android doesn't" or vice versa.
#
# Post-beta we can switch to SSR if we want route-level SEO on the
# marketing pages. For now, SPA everywhere.

[build]
  command = "npm run build:mobile"
  publish = "dist-mobile"

# TanStack Router does client-side routing, so every unknown URL must
# fall through to index.html and let React take over. Without this
# rule, /download, /profile, /bookings/xyz etc. all 404 on refresh /
# direct-link — which is exactly what you're seeing right now.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache assets fingerprinted by Vite; index.html stays no-cache
# so a redeploy reaches every user on next load.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Service worker must never be cached — otherwise a broken SW pins
# itself and users can't recover without dev-tools intervention.
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
